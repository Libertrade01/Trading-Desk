<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52">

  <!-- Mark: L as chart axis, no background box -->
  <line x1="12" y1="7"  x2="12" y2="42" stroke="#3a9aaa" stroke-width="4"   stroke-linecap="round"/>
  <line x1="12" y1="42" x2="40" y2="42" stroke="#3a9aaa" stroke-width="4"   stroke-linecap="round"/>
  <!-- Upward trend line through the L -->
  <polyline points="12,30 22,18 36,8"   stroke="#259186" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="36" cy="8" r="3" fill="#259186"/>

  <!-- Divider -->
  <line x1="54" y1="10" x2="54" y2="42" stroke="#c0ccd8" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="68" y="34" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="21" letter-spacing="1.5">
    <tspan font-weight="300" fill="#8a9ab0">LIBER</tspan><tspan font-weight="700" fill="#3a9aaa">TRADE</tspan>
  </text>

</svg>
